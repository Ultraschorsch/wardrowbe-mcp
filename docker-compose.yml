services:
  wardrowbe-mcp:
    build: .
    image: wardrowbe-mcp:local
    container_name: wardrowbe_mcp
    restart: unless-stopped
    environment:
      WARDROBE_INTERNAL_URL: ${WARDROBE_INTERNAL_URL:-http://backend:8000}
      WARDROBE_USER_EXTERNAL_ID: ${WARDROBE_USER_EXTERNAL_ID}
      WARDROBE_USER_EMAIL: ${WARDROBE_USER_EMAIL}
      POCKET_ID_CLIENT_ID: ${POCKET_ID_CLIENT_ID}
      POCKET_ID_CLIENT_SECRET: ${POCKET_ID_CLIENT_SECRET}
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL}
      MCP_JWT_SIGNING_KEY: ${MCP_JWT_SIGNING_KEY}
    ports:
      # NOTE: must bind 0.0.0.0, not 127.0.0.1 - Newt reaches this via the
      # host's LAN IP, not loopback (same as wardrobe_nginx). LAN access is
      # blocked by a DOCKER-USER iptables rule instead - see deployment notes.
      - "${MCP_BIND_ADDR:-0.0.0.0}:${MCP_PORT:-8010}:8000"
    networks:
      - wardrowbe_wardrobe_net
    volumes:
      # Persists registered OAuth clients (e.g. ChatGPT) and tokens across
      # rebuilds/redeploys - without this, everyone has to reconnect their
      # connector every time this stack gets redeployed.
      - oauth_storage:/data/oauth-storage

networks:
  wardrowbe_wardrobe_net:
    external: true
    name: wardrowbe_wardrobe_net

volumes:
  oauth_storage:
